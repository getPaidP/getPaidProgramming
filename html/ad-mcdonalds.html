<!DOCTYPE html>
<html lang=" en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCDONALDS</title>

  <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/",
          "three/examples/jsm/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js"
        }
      }
    </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .mouse-centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
    }

    .speed-input {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>
  <input class="mouse-centered" type="checkbox" />
  <input type="number" value="3" class="speed-input">
  <script type="module" src="../js/ad-mcdonalds.js"></script>
</body>

</html>
